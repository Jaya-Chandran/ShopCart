services:
  - type: web
    name: shopcart
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn shopcart.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: shopcart.settings
      - key: DATABASE_URL
        fromDatabase:
          name: shopcart-db
          property: connectionString

databases:
  - name: shopcart-db
    plan: free
